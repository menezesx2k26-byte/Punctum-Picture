name: Snapshot live Punctum public state

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/source-public-state.json"

permissions:
  contents: write

concurrency:
  group: punctum-source-public-state
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      ADMIN_ALLOWED_EMAILS_SECRET: ${{ secrets.ADMIN_ALLOWED_EMAILS }}
      SOURCE_ADMIN_EMAIL: ${{ secrets.SOURCE_ADMIN_EMAIL }}
      SOURCE_ADMIN_PASSWORD: ${{ secrets.SOURCE_ADMIN_PASSWORD }}
      PUNCTUM_ADMIN_EMAIL: ${{ secrets.PUNCTUM_ADMIN_EMAIL }}
      PUNCTUM_ADMIN_PASSWORD: ${{ secrets.PUNCTUM_ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Capture live public state and safe secret-presence flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p requests
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const origin = 'https://punctumpicture.com';
          async function json(path) {
            const response = await fetch(`${origin}${path}`, {
              headers: { accept: 'application/json' },
              redirect: 'follow',
            });
            if (!response.ok) throw new Error(`${path}_http_${response.status}`);
            return response.json();
          }

          const [site, categories, stats, archive, albumPage] = await Promise.all([
            json('/api/public/site'),
            json('/api/public/categories'),
            json('/api/public/stats'),
            json('/api/public/archive'),
            json('/api/public/albums?limit=100&page=1'),
          ]);

          const albumList = albumPage.albums ?? albumPage.items ?? [];
          if (!Array.isArray(albumList)) throw new Error('albums_shape_invalid');
          const albumDetails = [];
          for (const album of albumList) {
            if (!album?.slug) continue;
            const detail = await json(`/api/public/albums/${encodeURIComponent(album.slug)}`);
            albumDetails.push(detail.album ?? detail);
          }

          const images = archive.images ?? archive.photos ?? [];
          const dynamicImages = Array.isArray(images)
            ? images.filter((image) => image?.id && !String(image.id).startsWith('static-'))
            : [];

          const secretPresence = {
            ADMIN_PASSWORD_HASH: Boolean(process.env.ADMIN_PASSWORD_HASH),
            ADMIN_SESSION_SECRET: Boolean(process.env.ADMIN_SESSION_SECRET),
            ADMIN_ALLOWED_EMAILS: Boolean(process.env.ADMIN_ALLOWED_EMAILS_SECRET),
            SOURCE_ADMIN_EMAIL: Boolean(process.env.SOURCE_ADMIN_EMAIL),
            SOURCE_ADMIN_PASSWORD: Boolean(process.env.SOURCE_ADMIN_PASSWORD),
            PUNCTUM_ADMIN_EMAIL: Boolean(process.env.PUNCTUM_ADMIN_EMAIL),
            PUNCTUM_ADMIN_PASSWORD: Boolean(process.env.PUNCTUM_ADMIN_PASSWORD),
          };

          const snapshot = {
            format: 'punctum-live-public-state-v1',
            capturedAt: new Date().toISOString(),
            origin,
            counts: {
              categories: categories.categories?.length ?? null,
              albums: albumDetails.length,
              archiveImages: Array.isArray(images) ? images.length : null,
              dynamicImages: dynamicImages.length,
            },
            secretPresence,
            site,
            categories,
            stats,
            albums: albumDetails,
            archive,
          };

          const canonical = JSON.stringify(snapshot);
          snapshot.sha256 = crypto.createHash('sha256').update(canonical).digest('hex');
          fs.writeFileSync('/tmp/source-public-state-result.json', JSON.stringify(snapshot, null, 2) + '\n');
          console.log(JSON.stringify({ capturedAt: snapshot.capturedAt, counts: snapshot.counts, secretPresence, sha256: snapshot.sha256 }));
          NODE

      - name: Optionally import public snapshot to isolated Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.mode == "import-to-cloudflare"' requests/source-public-state.json >/dev/null; then
            cp /tmp/source-public-state-result.json requests/source-public-state-result.json
            npm install --global --no-audit --no-fund wrangler@4.125.0
            node scripts/import-public-state.mjs
          else
            echo "public import skipped"
          fi

      - name: Optionally migrate private admin state read-only from source
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.privateMigration == true' requests/source-public-state.json >/dev/null; then
            npm install --global --no-audit --no-fund wrangler@4.125.0
            node scripts/migrate-private-admin-state.mjs
          else
            echo "private migration skipped"
          fi

      - name: Optionally configure and verify destination admin login
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.configureDestinationAdmin == true' requests/source-public-state.json >/dev/null; then
            npm install --global --no-audit --no-fund wrangler@4.125.0
            node scripts/configure-destination-admin.mjs
          else
            echo "destination admin bootstrap skipped"
          fi

      - name: Optionally audit authenticated private parity
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.adminParityAudit == true' requests/source-public-state.json >/dev/null; then
            node scripts/audit-private-admin-parity.mjs
          else
            echo "private admin parity audit skipped"
          fi

      - name: Optionally probe pending source media read-only
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.probePendingMedia == true' requests/source-public-state.json >/dev/null; then
            npm install --global --no-audit --no-fund wrangler@4.125.0
            node scripts/probe-source-pending-media.mjs
          else
            echo "pending media probe skipped"
          fi

      - name: Optionally audit media bytes read-only
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.mediaByteParityAudit == true' requests/source-public-state.json >/dev/null; then
            node scripts/audit-media-byte-parity.mjs
          else
            echo "media byte parity audit skipped"
          fi

      - name: Persist sanitized results safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/source-public-state-result.json ]; then cp /tmp/source-public-state-result.json requests/source-public-state-result.json; fi
          if [ -f /tmp/cloudflare-import-public-state-v2-result.json ]; then cp /tmp/cloudflare-import-public-state-v2-result.json requests/cloudflare-import-public-state-v2-result.json; fi
          if [ -f /tmp/source-private-state-migration-result.json ]; then cp /tmp/source-private-state-migration-result.json requests/source-private-state-migration-result.json; fi
          if [ -f /tmp/destination-admin-bootstrap-result.json ]; then cp /tmp/destination-admin-bootstrap-result.json requests/destination-admin-bootstrap-result.json; fi
          if [ -f /tmp/private-admin-parity-result.json ]; then cp /tmp/private-admin-parity-result.json requests/private-admin-parity-result.json; fi
          if [ -f /tmp/source-pending-media-probe-result.json ]; then cp /tmp/source-pending-media-probe-result.json requests/source-pending-media-probe-result.json; fi
          if [ -f /tmp/media-byte-parity-result.json ]; then cp /tmp/media-byte-parity-result.json requests/media-byte-parity-result.json; fi
          git add requests/source-public-state-result.json requests/cloudflare-import-public-state-v2-result.json requests/source-private-state-migration-result.json requests/destination-admin-bootstrap-result.json requests/private-admin-parity-result.json requests/source-pending-media-probe-result.json requests/media-byte-parity-result.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record live snapshot and migration results"
          git push
