name: Migrate Punctum private admin state

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/source-private-state-migration.json"

permissions:
  contents: write

concurrency:
  group: punctum-source-private-state-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_ADMIN_EMAIL: ${{ secrets.SOURCE_ADMIN_EMAIL }}
      SOURCE_ADMIN_PASSWORD: ${{ secrets.SOURCE_ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install trusted Wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.125.0

      - name: Capture source admin state read-only and migrate exposed state
        run: node scripts/migrate-private-admin-state.mjs

      - name: Persist sanitized result only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/source-private-state-migration-result.json ]; then
            printf '%s\n' '{"status":"failed","error":"workflow_failed_before_result","sourceReadOnly":true,"domainTouched":false}' > /tmp/source-private-state-migration-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/source-private-state-migration-result.json requests/source-private-state-migration-result.json
          git add requests/source-private-state-migration-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record private-state migration result"
          git push
