name: Finalize Punctum migration worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/cloudflare-worker-finalize.json"

permissions:
  contents: write

concurrency:
  group: punctum-cloudflare-worker-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install trusted Wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.125.0

      - name: Validate existing destination and deploy generated vinext worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p requests

          cat > requests/cloudflare-worker-finalize-result.json <<'EOF'
          {
            "status": "running",
            "d1": false,
            "r2_originals": false,
            "r2_backups": false,
            "npm_ci": false,
            "typecheck": false,
            "lint": false,
            "tests": false,
            "build": false,
            "generated_config": false,
            "worker": false,
            "worker_name": "punctum-picture-migration",
            "domain_touched": false
          }
          EOF

          sanitize_log() {
            file="$1"
            if [ ! -f "$file" ]; then
              printf '%s' 'log unavailable'
              return
            fi
            tail -n 120 "$file" \
              | sed -E 's/[A-Fa-f0-9]{24,}/[redacted-id]/g' \
              | sed -E 's/(cfat_|cfut_)[A-Za-z0-9_-]+/[redacted-cloudflare-token]/g' \
              | sed -E 's/[A-Za-z0-9_-]{45,}/[redacted-long-token]/g' \
              | cut -c1-3500
          }

          fail() {
            message="$1"
            jq --arg message "$message" '.status="failed" | .error=$message' requests/cloudflare-worker-finalize-result.json > /tmp/result.json
            mv /tmp/result.json requests/cloudflare-worker-finalize-result.json
            exit 1
          }

          fail_with_log() {
            message="$1"
            file="$2"
            detail="$(sanitize_log "$file")"
            jq --arg message "$message" --arg detail "$detail" '.status="failed" | .error=$message | .detail=$detail' requests/cloudflare-worker-finalize-result.json > /tmp/result.json
            mv /tmp/result.json requests/cloudflare-worker-finalize-result.json
            exit 1
          }

          mark() {
            key="$1"
            jq --arg key "$key" '.[$key]=true' requests/cloudflare-worker-finalize-result.json > /tmp/result.json
            mv /tmp/result.json requests/cloudflare-worker-finalize-result.json
          }

          D1_HTTP="$(curl -sS -o /tmp/d1.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" || true)"
          [ "$D1_HTTP" = "200" ] && jq -e '.success == true' /tmp/d1.json >/dev/null 2>&1 || fail "d1_read_failed"
          DB_ID="$(jq -r '.result[]? | select(.name == "punctum-picture") | (.uuid // .id // empty)' /tmp/d1.json | head -n1)"
          [ -n "$DB_ID" ] || fail "d1_database_missing"
          mark d1
          jq --arg id "$DB_ID" '.d1_database_id=$id' requests/cloudflare-worker-finalize-result.json > /tmp/result.json
          mv /tmp/result.json requests/cloudflare-worker-finalize-result.json

          wrangler r2 bucket info punctum-picture-originals --json >/tmp/r2-originals.json 2>/tmp/r2-originals.err || fail_with_log "r2_originals_missing" /tmp/r2-originals.err
          mark r2_originals
          wrangler r2 bucket info punctum-picture-backups --json >/tmp/r2-backups.json 2>/tmp/r2-backups.err || fail_with_log "r2_backups_missing" /tmp/r2-backups.err
          mark r2_backups

          npm ci >/tmp/npm-ci.log 2>&1 || fail_with_log "npm_ci_failed" /tmp/npm-ci.log
          mark npm_ci
          npm run typecheck >/tmp/typecheck.log 2>&1 || fail_with_log "typecheck_failed" /tmp/typecheck.log
          mark typecheck
          npm run lint >/tmp/lint.log 2>&1 || fail_with_log "lint_failed" /tmp/lint.log
          mark lint

          npm run build >/tmp/build.log 2>&1 || fail_with_log "build_failed" /tmp/build.log
          mark build

          [ -f dist/server/wrangler.json ] || fail_with_log "generated_wrangler_missing" /tmp/build.log

          DB_ID="$DB_ID" node <<'NODE'
          import fs from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          config.name = 'punctum-picture-migration';
          config.workers_dev = true;
          config.preview_urls = true;

          delete config.routes;
          delete config.triggers;
          delete config.env;

          config.d1_databases = [{
            binding: 'DB',
            database_name: 'punctum-picture',
            database_id: process.env.DB_ID,
          }];
          config.r2_buckets = [
            { binding: 'ORIGINALS', bucket_name: 'punctum-picture-originals' },
            { binding: 'BACKUPS', bucket_name: 'punctum-picture-backups' },
          ];
          config.images = { binding: 'IMAGES' };
          config.observability = { enabled: true };
          config.vars = {
            ENVIRONMENT: 'migration',
            SITE_ORIGIN: 'https://punctum-picture-migration.menezesx2k26.workers.dev',
            PUBLIC_SITE_URL: 'https://migration.invalid',
            PUBLIC_WHATSAPP_E164: 'UNSPECIFIED',
            PUBLIC_INSTAGRAM_URL: 'UNSPECIFIED',
            MAX_UPLOAD_BYTES: '26214400',
            ALLOWED_MIME_TYPES: 'image/jpeg,image/png,image/webp',
            PRESIGNED_URL_TTL_SECONDS: '900',
            CONTACT_RATE_LIMIT_WINDOW_SECONDS: '3600',
            CONTACT_RATE_LIMIT_MAX: '5',
            ADMIN_RATE_LIMIT_WINDOW_SECONDS: '60',
            ADMIN_RATE_LIMIT_MAX: '60',
            BACKUP_PREFIX: 'backups/d1',
            BACKUP_RETENTION_DAYS: '180',
            CLEANUP_ORPHAN_UPLOAD_AGE_HOURS: '24',
          };

          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          mark generated_config

          npm test >/tmp/tests.log 2>&1 || fail_with_log "tests_failed" /tmp/tests.log
          mark tests

          if ! wrangler deploy --config dist/server/wrangler.json > /tmp/deploy.txt 2>&1; then
            fail_with_log "worker_deploy_failed" /tmp/deploy.txt
          fi

          WORKER_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.txt | tail -n1 || true)"
          jq --arg url "$WORKER_URL" '.status="success" | .worker=true | .worker_url=(if $url == "" then null else $url end) | .domain_touched=false' requests/cloudflare-worker-finalize-result.json > /tmp/result.json
          mv /tmp/result.json requests/cloudflare-worker-finalize-result.json

      - name: Persist sanitized finalization result
        if: always()
        run: |
          if [ ! -f requests/cloudflare-worker-finalize-result.json ]; then
            printf '%s\n' '{"status":"failed","error":"workflow_failed_before_result","domain_touched":false}' > requests/cloudflare-worker-finalize-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/cloudflare-worker-finalize-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record Punctum worker finalization result"
          git push
