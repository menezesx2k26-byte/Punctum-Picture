name: Diagnose Punctum custom domain

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/cloudflare-domain-diagnose.json"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Probe production and compare Hero with Git
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HTTP="$(curl -sS -L --max-time 20 -o /tmp/root-body -w '%{http_code}' https://punctumpicture.com/api/public/stats || true)"
          WWW_HTTP="$(curl -sS -L --max-time 20 -o /tmp/www-body -w '%{http_code}' https://www.punctumpicture.com/api/public/stats || true)"
          HERO_HTTP="$(curl -sS -L --max-time 20 -o /tmp/hero-p001.jpg -w '%{http_code}' 'https://punctumpicture.com/photos/p001.jpg?verify=pixel-v2' || true)"

          python -m pip install --disable-pip-version-check --quiet pillow

          EXPECTED_SHA="$(sha256sum public/photos/p001.jpg | awk '{print $1}')"
          EXPECTED_BYTES="$(wc -c < public/photos/p001.jpg | tr -d ' ')"
          HERO_SHA=''
          HERO_BYTES=0
          VISUAL='{"available":false,"matchesGitVisually":false}'
          if [ "$HERO_HTTP" = "200" ] && [ -s /tmp/hero-p001.jpg ]; then
            HERO_SHA="$(sha256sum /tmp/hero-p001.jpg | awk '{print $1}')"
            HERO_BYTES="$(wc -c < /tmp/hero-p001.jpg | tr -d ' ')"
            VISUAL="$(python .github/scripts/compare-hero.py public/photos/p001.jpg /tmp/hero-p001.jpg)"
          fi

          ROOT_OK=false
          WWW_OK=false
          if [ "$ROOT_HTTP" = "200" ] && jq -e '.stats.photoCount == 192 and .stats.albumCount == 16' /tmp/root-body >/dev/null 2>&1; then ROOT_OK=true; fi
          if [ "$WWW_HTTP" = "200" ] && jq -e '.stats.photoCount == 192 and .stats.albumCount == 16' /tmp/www-body >/dev/null 2>&1; then WWW_OK=true; fi

          BYTE_MATCH=false
          if [ "$HERO_SHA" = "$EXPECTED_SHA" ]; then BYTE_MATCH=true; fi

          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg rootHttp "$ROOT_HTTP" \
            --arg wwwHttp "$WWW_HTTP" \
            --arg heroHttp "$HERO_HTTP" \
            --arg heroSha "$HERO_SHA" \
            --arg expectedSha "$EXPECTED_SHA" \
            --argjson heroBytes "$HERO_BYTES" \
            --argjson expectedBytes "$EXPECTED_BYTES" \
            --argjson rootOk "$ROOT_OK" \
            --argjson wwwOk "$WWW_OK" \
            --argjson byteMatch "$BYTE_MATCH" \
            --argjson visual "$VISUAL" \
            '{status:"success",checkedAt:$checkedAt,http:{root:$rootHttp,www:$wwwHttp,hero:$heroHttp,rootMatchesWorker:$rootOk,wwwMatchesWorker:$wwwOk},hero:{productionSha256:$heroSha,gitSha256:$expectedSha,productionBytes:$heroBytes,gitBytes:$expectedBytes,matchesGitBytes:$byteMatch,visual:$visual},cloudflareStateChanged:false}' \
            > /tmp/domain-diagnose-result.json

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/domain-diagnose-result.json ] || printf '%s\n' '{"status":"failed","error":"diagnosis_failed","cloudflareStateChanged":false}' > /tmp/domain-diagnose-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/domain-diagnose-result.json requests/cloudflare-domain-diagnose-result.json
          git add requests/cloudflare-domain-diagnose-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record Punctum domain diagnosis"
          git push
