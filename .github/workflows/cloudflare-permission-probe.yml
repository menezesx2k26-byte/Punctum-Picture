name: Probe Cloudflare token permissions

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/cloudflare-permission-probe.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe permissions without changing Cloudflare state
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          http_get() {
            local url="$1" out="$2"
            curl -sS -o "$out" -w '%{http_code}' "${AUTH[@]}" "$url" || true
          }

          VERIFY_HTTP="$(http_get "$API/user/tokens/verify" /tmp/verify.json)"

          ZONE_LIST_HTTP="$(curl -sS -G -o /tmp/zones.json -w '%{http_code}' "${AUTH[@]}" \
            --data-urlencode 'name=punctumpicture.com' \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            "$API/zones" || true)"
          ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/zones.json 2>/dev/null || true)"
          ZONE_STATUS="$(jq -r '.result[0].status // empty' /tmp/zones.json 2>/dev/null || true)"

          DNS_READ_HTTP='000'
          DNS_EDIT_HTTP='000'
          if [ -n "$ZONE_ID" ]; then
            DNS_READ_HTTP="$(http_get "$API/zones/${ZONE_ID}/dns_records?per_page=1" /tmp/dns-read.json)"
            # Permission probe only: invalid/nonexistent record id can never match a real DNS record.
            # 400/404 => authorization passed and validation/resource lookup rejected it.
            # 401/403 => token lacks authorization for DNS edit.
            DNS_EDIT_HTTP="$(curl -sS -o /tmp/dns-edit.json -w '%{http_code}' -X DELETE "${AUTH[@]}" \
              "$API/zones/${ZONE_ID}/dns_records/00000000000000000000000000000000" || true)"
          else
            printf '%s\n' '{"success":false,"errors":[{"message":"zone id unavailable"}]}' >/tmp/dns-read.json
            cp /tmp/dns-read.json /tmp/dns-edit.json
          fi

          WORKER_HTTP="$(http_get "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" /tmp/workers.json)"
          R2_HTTP="$(http_get "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" /tmp/r2.json)"

          D1_HTTP="$(curl -sS -o /tmp/d1.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" || true)"

          ok200() { [ "$1" = "200" ] && echo true || echo false; }
          dns_edit_ok=false
          case "$DNS_EDIT_HTTP" in
            400|404|405|409|422) dns_edit_ok=true ;;
          esac

          sanitize_errors() {
            jq -c '[.errors[]? | {code:(.code // null),message:(.message // "")} ]' "$1" 2>/dev/null || echo '[]'
          }

          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg verifyHttp "$VERIFY_HTTP" \
            --arg zoneHttp "$ZONE_LIST_HTTP" \
            --arg zoneStatus "$ZONE_STATUS" \
            --arg dnsReadHttp "$DNS_READ_HTTP" \
            --arg dnsEditHttp "$DNS_EDIT_HTTP" \
            --arg workerHttp "$WORKER_HTTP" \
            --arg r2Http "$R2_HTTP" \
            --arg d1Http "$D1_HTTP" \
            --argjson verifyOk "$(ok200 "$VERIFY_HTTP")" \
            --argjson zoneRead "$(ok200 "$ZONE_LIST_HTTP")" \
            --argjson dnsRead "$(ok200 "$DNS_READ_HTTP")" \
            --argjson dnsEdit "$dns_edit_ok" \
            --argjson workerRead "$(ok200 "$WORKER_HTTP")" \
            --argjson r2Read "$(ok200 "$R2_HTTP")" \
            --argjson d1Read "$(ok200 "$D1_HTTP")" \
            --argjson zoneErrors "$(sanitize_errors /tmp/zones.json)" \
            --argjson dnsReadErrors "$(sanitize_errors /tmp/dns-read.json)" \
            --argjson dnsEditErrors "$(sanitize_errors /tmp/dns-edit.json)" \
            --argjson workerErrors "$(sanitize_errors /tmp/workers.json)" \
            --argjson r2Errors "$(sanitize_errors /tmp/r2.json)" \
            --argjson d1Errors "$(sanitize_errors /tmp/d1.json)" \
            '{status:"success",checkedAt:$checkedAt,tokenValid:$verifyOk,zoneStatus:$zoneStatus,permissions:{zoneRead:$zoneRead,dnsRead:$dnsRead,dnsEdit:$dnsEdit,workerRead:$workerRead,r2Read:$r2Read,d1ReadViaDedicatedToken:$d1Read},http:{verify:$verifyHttp,zoneRead:$zoneHttp,dnsRead:$dnsReadHttp,dnsEditProbe:$dnsEditHttp,workerRead:$workerHttp,r2Read:$r2Http,d1Read:$d1Http},errors:{zone:$zoneErrors,dnsRead:$dnsReadErrors,dnsEdit:$dnsEditErrors,worker:$workerErrors,r2:$r2Errors,d1:$d1Errors},cloudflareStateChanged:false,note:"DNS edit tested only against an impossible/nonexistent record id; no record can be modified."}' \
            > /tmp/cloudflare-permission-probe-result.json

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/cloudflare-permission-probe-result.json ] || printf '%s\n' '{"status":"failed","error":"workflow_failed_before_result","cloudflareStateChanged":false}' > /tmp/cloudflare-permission-probe-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/cloudflare-permission-probe-result.json requests/cloudflare-permission-probe-result.json
          git add requests/cloudflare-permission-probe-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record Cloudflare permission probe"
          git push
