name: Hero asset diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hero-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Inspect hero through build boundary
        shell: bash
        run: |
          set -euo pipefail
          src='public/images/hero-maria.webp'
          echo '=== repository asset ==='
          ls -l "$src" || true
          file "$src" || true
          xxd -l 32 "$src" || true
          sha256sum "$src" || true
          echo "bytes=$(wc -c < "$src")"

          echo '=== malformed base64 evidence ==='
          python <<'PY'
          from pathlib import Path
          import base64
          p = Path('public/images/hero-maria.webp')
          data = p.read_bytes()
          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          bad = [(i,b) for i,b in enumerate(data) if b not in allowed]
          print('invalid_count=', len(bad))
          print('first_invalid=', bad[:20])
          print('tail_repr=', repr(data[-120:]))
          compact = b''.join(data.split())
          print('compact_len=', len(compact), 'mod4=', len(compact)%4)
          try:
              decoded = base64.b64decode(compact, validate=True)
              print('strict_decode=ok', 'decoded_len=', len(decoded), 'head=', decoded[:16], 'riff=', decoded[:4], 'webp=', decoded[8:12])
          except Exception as e:
              print('strict_decode=failed', type(e).__name__, str(e))
          try:
              decoded = base64.b64decode(compact, validate=False)
              print('lenient_decode=ok', 'decoded_len=', len(decoded), 'head=', decoded[:16], 'riff=', decoded[:4], 'webp=', decoded[8:12])
          except Exception as e:
              print('lenient_decode=failed', type(e).__name__, str(e))
          PY

          echo '=== built asset candidates ==='
          find dist/client -type f \( -name '*hero*maria*' -o -path '*/images/hero-maria.webp' \) -print -exec ls -l {} \; -exec file {} \; -exec xxd -l 16 {} \; -exec sha256sum {} \; || true

          echo '=== exact built path ==='
          if [ -f dist/client/images/hero-maria.webp ]; then
            echo 'BUILT_HERO=present'
          else
            echo 'BUILT_HERO=missing'
          fi

      - name: Probe production hero URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://punctumpicture.com/images/hero-maria.webp'
          HTTP="$(curl -sS -o /tmp/hero-body -D /tmp/hero-headers -w '%{http_code}' "$URL" || true)"
          echo "HTTP=$HTTP"
          echo '=== headers ==='
          cat /tmp/hero-headers || true
          echo '=== body ==='
          wc -c /tmp/hero-body || true
          file /tmp/hero-body || true
          xxd -l 32 /tmp/hero-body || true
          sha256sum /tmp/hero-body || true
