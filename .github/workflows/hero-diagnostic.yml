name: Hero asset diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hero-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Inspect broken current hero
        shell: bash
        run: |
          set -euo pipefail
          src='public/images/hero-maria.webp'
          file "$src"
          xxd -l 32 "$src"
          sha256sum "$src"
          echo "bytes=$(wc -c < "$src")"

      - name: Validate historical focused hero backup
        shell: bash
        run: |
          set -euo pipefail
          commit='bf0be7a17f7acbf81774478b1e85b3c1263e68e3'
          path='public/photos/hero-stadium-focus-2026-08-24.svg'
          git fetch --no-tags --depth=1 origin "$commit"
          git show "$commit:$path" > /tmp/hero-backup.svg
          python <<'PY'
          from pathlib import Path
          import base64, re, struct

          svg = Path('/tmp/hero-backup.svg').read_text()
          m = re.search(r'data:image/webp;base64,([^"\']+)', svg)
          if not m:
              raise SystemExit('embedded WebP data URI not found')
          payload = ''.join(m.group(1).split())
          raw = base64.b64decode(payload, validate=True)
          print('decoded_len=', len(raw))
          print('head=', raw[:16])
          print('riff=', raw[:4], 'webp=', raw[8:12])
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('backup is not a valid WebP container')
          declared = struct.unpack('<I', raw[4:8])[0] + 8
          print('riff_declared_total=', declared, 'actual=', len(raw))
          if declared != len(raw):
              raise SystemExit('backup WebP is truncated or has trailing corruption')
          Path('/tmp/hero-backup.webp').write_bytes(raw)
          PY
          file /tmp/hero-backup.webp
          xxd -l 16 /tmp/hero-backup.webp
          sha256sum /tmp/hero-backup.webp

      - name: Probe production hero URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://punctumpicture.com/images/hero-maria.webp'
          HTTP="$(curl -sS -o /tmp/hero-body -D /tmp/hero-headers -w '%{http_code}' "$URL" || true)"
          echo "HTTP=$HTTP"
          grep -iE '^(content-type|content-length|cf-cache-status|etag):' /tmp/hero-headers || true
          file /tmp/hero-body || true
          xxd -l 32 /tmp/hero-body || true
          sha256sum /tmp/hero-body || true
