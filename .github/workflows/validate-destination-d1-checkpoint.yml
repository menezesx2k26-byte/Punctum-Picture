name: Validate Punctum D1 checkpoint restore

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/checkpoint-validation.json"

permissions:
  contents: write

concurrency:
  group: punctum-d1-checkpoint-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install trusted Wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.125.0

      - name: Validate checkpoint by local restore only
        run: node scripts/validate-destination-d1-checkpoint.mjs

      - name: Persist sanitized validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/destination-d1-checkpoint-validation-result.json ]; then
            printf '%s\n' '{"status":"failed","error":"validation_failed_before_result","destinationD1Touched":false,"sourceTouched":false,"domainTouched":false,"publicStudioActivated":false}' > /tmp/destination-d1-checkpoint-validation-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/destination-d1-checkpoint-validation-result.json requests/destination-d1-checkpoint-validation-result.json
          git add requests/destination-d1-checkpoint-validation-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record D1 checkpoint restore validation"
          git push
