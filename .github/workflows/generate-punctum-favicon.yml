name: Generate Punctum favicon

on:
  workflow_dispatch:
  push:
    branches:
      - chore/punctum-favicon
    paths:
      - public/logo-punctum.png
      - .github/workflows/generate-punctum-favicon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate favicon family from canonical logo
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          source = Path("public/logo-punctum.png")
          if not source.exists():
              raise SystemExit("Canonical logo not found: public/logo-punctum.png")

          logo = Image.open(source).convert("RGBA")
          width, height = logo.size

          # SiteChrome displays the canonical asset inside a near-square crop.
          # Keep the original artwork untouched and derive the favicon only by
          # selecting a centered/top square and downsampling it.
          side = min(width, height)
          left = max(0, (width - side) // 2)
          top = 0 if height > width else max(0, (height - side) // 2)
          mark = logo.crop((left, top, left + side, top + side))

          def write_png(path: str, size: int) -> None:
              out = mark.resize((size, size), Image.Resampling.LANCZOS)
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              out.save(path, "PNG", optimize=True)

          write_png("app/icon.png", 512)
          write_png("app/apple-icon.png", 180)
          write_png("public/favicon-16x16.png", 16)
          write_png("public/favicon-32x32.png", 32)
          write_png("public/favicon-48x48.png", 48)
          write_png("public/apple-touch-icon.png", 180)
          write_png("public/android-chrome-192x192.png", 192)
          write_png("public/android-chrome-512x512.png", 512)

          Path("app").mkdir(parents=True, exist_ok=True)
          ico_source = mark.resize((256, 256), Image.Resampling.LANCZOS)
          ico_source.save(
              "app/favicon.ico",
              format="ICO",
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          Path("public").mkdir(parents=True, exist_ok=True)
          ico_source.save(
              "public/favicon.ico",
              format="ICO",
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )

          print(f"source={source} size={width}x{height}")
          print(f"crop=({left},{top}) {side}x{side}")

      - name: Upload favicon pack
        uses: actions/upload-artifact@v4
        with:
          name: punctum-favicon-pack
          if-no-files-found: error
          path: |
            app/favicon.ico
            app/icon.png
            app/apple-icon.png
            public/favicon.ico
            public/favicon-16x16.png
            public/favicon-32x32.png
            public/favicon-48x48.png
            public/apple-touch-icon.png
            public/android-chrome-192x192.png
            public/android-chrome-512x512.png

      - name: Commit generated favicon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/favicon.ico app/icon.png app/apple-icon.png \
                  public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png \
                  public/favicon-48x48.png public/apple-touch-icon.png \
                  public/android-chrome-192x192.png public/android-chrome-512x512.png
          if git diff --cached --quiet; then
            echo "No favicon changes to commit."
            exit 0
          fi
          git commit -m "feat: add Punctum favicon assets"
          git push origin HEAD:${{ github.ref_name }}
