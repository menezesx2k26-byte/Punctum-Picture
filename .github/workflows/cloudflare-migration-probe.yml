name: Cloudflare migration probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/cloudflare-probe.json"

permissions:
  contents: write

concurrency:
  group: cloudflare-migration-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install trusted Wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.112.0
      - name: Run read-only probe
        id: probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          whoami_ok=false
          d1_ok=false
          r2_ok=false

          wrangler whoami >/tmp/whoami.txt 2>&1 && whoami_ok=true
          wrangler d1 list >/tmp/d1.txt 2>&1 && d1_ok=true
          wrangler r2 bucket list >/tmp/r2.txt 2>&1 && r2_ok=true

          sanitize() {
            tail -n 12 "$1" \
              | sed -E 's/[A-Fa-f0-9]{24,}/[redacted-id]/g' \
              | sed -E 's/[A-Za-z0-9_-]{35,}/[redacted-secret]/g' \
              | tr '\n' ' ' \
              | cut -c1-1200
          }

          d1_error=""
          r2_error=""
          if [ "$d1_ok" != true ]; then d1_error="$(sanitize /tmp/d1.txt)"; fi
          if [ "$r2_ok" != true ]; then r2_error="$(sanitize /tmp/r2.txt)"; fi

          overall=false
          if [ "$whoami_ok" = true ] && [ "$d1_ok" = true ] && [ "$r2_ok" = true ]; then
            overall=true
          fi

          mkdir -p requests
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_commit "$GITHUB_SHA" \
            --argjson whoami "$whoami_ok" \
            --argjson d1_read "$d1_ok" \
            --argjson r2_read "$r2_ok" \
            --argjson overall "$overall" \
            --arg d1_error "$d1_error" \
            --arg r2_error "$r2_error" \
            '{checked_at:$checked_at,source_commit:$source_commit,whoami:$whoami,d1_read:$d1_read,r2_read:$r2_read,overall:$overall,d1_error:(if $d1_error=="" then null else $d1_error end),r2_error:(if $r2_error=="" then null else $r2_error end)}' \
            > requests/cloudflare-probe-result.json
      - name: Persist sanitized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/cloudflare-probe-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record Cloudflare migration probe result"
          git push
