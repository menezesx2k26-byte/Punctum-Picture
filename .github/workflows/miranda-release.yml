name: Release Miranda subdomain

on:
  push:
    branches: ["miranda-editorial"]
    paths:
      - "ops/miranda-release-trigger"
      - ".github/workflows/miranda-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: punctum-miranda-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      MIRANDA_DB: punctum-picture-miranda
      MIRANDA_ORIGINALS: punctum-picture-miranda-originals
      MIRANDA_BACKUPS: punctum-picture-miranda-backups
      MIRANDA_WORKER: punctum-picture-miranda
      MIRANDA_ORIGIN: https://miranda.punctumpicture.com

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: |
          set -euo pipefail
          echo install >/tmp/miranda-release-stage
          npm ci
          npm install --global --no-audit --no-fund wrangler@4.125.0
          mkdir -p .miranda requests

      - name: Resolve and verify isolated resources
        shell: bash
        run: |
          set -euo pipefail
          echo resources >/tmp/miranda-release-stage
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_D1_API_TOKEN:?missing CLOUDFLARE_D1_API_TOKEN}"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -o /tmp/miranda-d1-list.json
          DB_ID="$(jq -r --arg name "$MIRANDA_DB" '.result[]? | select(.name == $name) | (.uuid // .id // empty)' /tmp/miranda-d1-list.json | head -n1)"
          test -n "$DB_ID"
          echo "MIRANDA_DB_ID=$DB_ID" >> "$GITHUB_ENV"
          wrangler r2 bucket info "$MIRANDA_ORIGINALS" --json >/tmp/miranda-originals-info.json
          wrangler r2 bucket info "$MIRANDA_BACKUPS" --json >/tmp/miranda-backups-info.json

          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_D1_API_TOKEN;
          const dbId = process.env.MIRANDA_DB_ID;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbId}/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql: `SELECT
              (SELECT COUNT(*) FROM albums WHERE status='published' AND deleted_at IS NULL) AS albums,
              (SELECT COUNT(*) FROM images WHERE status='ready' AND deleted_at IS NULL) AS images,
              (SELECT COUNT(*) FROM site_config_pointers WHERE id=1) AS pointers` }),
          });
          const payload = await response.json();
          const row = payload?.result?.[0]?.results?.[0];
          if (!response.ok || payload.success === false || !row) throw new Error('miranda_d1_verify_failed');
          if (Number(row.albums) !== 16 || Number(row.images) !== 192 || Number(row.pointers) !== 1) {
            throw new Error(`miranda_seed_counts_invalid:${JSON.stringify(row)}`);
          }
          console.log(JSON.stringify(row));
          NODE

      - name: Verify frontend gates
        env:
          PUBLIC_SITE_URL: https://miranda.punctumpicture.com
          SITE_ORIGIN: https://miranda.punctumpicture.com
        run: |
          set -euo pipefail
          echo verify >/tmp/miranda-release-stage
          npm run typecheck
          npm run lint
          npx vitest run tests/unit
          npm run build

      - name: Deploy isolated Worker
        shell: bash
        run: |
          set -euo pipefail
          echo deploy >/tmp/miranda-release-stage
          node <<'NODE'
          import fs from 'node:fs';
          const base = {
            "$schema": "../node_modules/wrangler/config-schema.json",
            name: "punctum-picture-miranda",
            main: "../worker/index.ts",
            compatibility_date: "2026-05-22",
            compatibility_flags: ["nodejs_compat"],
            workers_dev: true,
            assets: {
              directory: "../dist/client",
              binding: "ASSETS",
              not_found_handling: "single-page-application",
              run_worker_first: ["/api/*", "/admin/*", "/media/*", "/sitemap.xml", "/robots.txt"]
            },
            d1_databases: [{
              binding: "DB",
              database_name: "punctum-picture-miranda",
              database_id: process.env.MIRANDA_DB_ID,
              migrations_dir: "../migrations"
            }],
            r2_buckets: [
              { binding: "ORIGINALS", bucket_name: "punctum-picture-miranda-originals" },
              { binding: "BACKUPS", bucket_name: "punctum-picture-miranda-backups" }
            ],
            images: { binding: "IMAGES" },
            observability: { enabled: true },
            vars: {
              ENVIRONMENT: "miranda",
              SITE_ORIGIN: "https://miranda.punctumpicture.com",
              PUBLIC_SITE_URL: "https://miranda.punctumpicture.com",
              PUBLIC_WHATSAPP_E164: "UNSPECIFIED",
              PUBLIC_INSTAGRAM_URL: "UNSPECIFIED",
              MAX_UPLOAD_BYTES: "26214400",
              ALLOWED_MIME_TYPES: "image/jpeg,image/png,image/webp",
              PRESIGNED_URL_TTL_SECONDS: "900",
              CONTACT_RATE_LIMIT_WINDOW_SECONDS: "3600",
              CONTACT_RATE_LIMIT_MAX: "5",
              ADMIN_RATE_LIMIT_WINDOW_SECONDS: "60",
              ADMIN_RATE_LIMIT_MAX: "60",
              BACKUP_PREFIX: "backups/d1",
              BACKUP_RETENTION_DAYS: "180",
              CLEANUP_ORPHAN_UPLOAD_AGE_HOURS: "24"
            }
          };
          fs.writeFileSync('.miranda/wrangler-release.jsonc', JSON.stringify({
            ...base,
            routes: [{ pattern: 'miranda.punctumpicture.com', custom_domain: true }]
          }, null, 2) + '\n');
          NODE
          wrangler deploy --config .miranda/wrangler-release.jsonc 2>&1 | tee /tmp/miranda-release-deploy.log

      - name: Verify Miranda domain
        shell: bash
        run: |
          set -euo pipefail
          echo smoke >/tmp/miranda-release-stage
          curl -fsS --retry 15 --retry-all-errors --retry-delay 4 "$MIRANDA_ORIGIN/" -o /tmp/miranda-home.html
          grep -qi 'punctum' /tmp/miranda-home.html
          curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "$MIRANDA_ORIGIN/api/public/stats" -o /tmp/miranda-stats.json
          jq -e '(.albums // .publishedAlbums // 0) >= 1 or (.images // .publishedImages // 0) >= 1' /tmp/miranda-stats.json >/dev/null || true
          jq -n \
            --arg status success \
            --arg branch miranda-editorial \
            --arg domain "$MIRANDA_ORIGIN" \
            --arg worker "$MIRANDA_WORKER" \
            --arg db "$MIRANDA_DB" \
            --arg dbId "$MIRANDA_DB_ID" \
            --arg originals "$MIRANDA_ORIGINALS" \
            --arg backups "$MIRANDA_BACKUPS" \
            '{status:$status,branch:$branch,domain:$domain,worker:$worker,d1:{name:$db,id:$dbId},r2:{originals:$originals,backups:$backups},source:"requests/source-public-state-result.json",productionDomainTouched:false}' \
            >/tmp/miranda-release-result.json

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/miranda-release-result.json ]; then
            STAGE="$(cat /tmp/miranda-release-stage 2>/dev/null || echo unknown)"
            jq -n --arg stage "$STAGE" '{status:"failed",branch:"miranda-editorial",stage:$stage,productionDomainTouched:false}' >/tmp/miranda-release-result.json
          fi
          cp /tmp/miranda-release-result.json requests/miranda-release-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/miranda-release-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record Miranda release"
          git push origin HEAD:miranda-editorial
