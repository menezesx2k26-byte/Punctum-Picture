name: Probe Concursos Cloudflare capabilities

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/concursos-credential-probe.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe read-only capabilities
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          probe() {
            local url="$1" out="$2"
            curl -sS -o "$out" -w '%{http_code}' "${AUTH[@]}" "$url" || true
          }
          errors() {
            jq -c '[.errors[]? | {code:(.code // null),message:(.message // "")} ]' "$1" 2>/dev/null || echo '[]'
          }
          ok200() { [ "$1" = "200" ] && echo true || echo false; }

          WORKERS_HTTP="$(probe "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" /tmp/workers.json)"
          KV_HTTP="$(probe "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=1" /tmp/kv.json)"
          TARGET_HTTP="$(probe "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/concursos-watch-redundante/settings" /tmp/target.json)"

          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workersHttp "$WORKERS_HTTP" \
            --arg kvHttp "$KV_HTTP" \
            --arg targetHttp "$TARGET_HTTP" \
            --argjson workersRead "$(ok200 "$WORKERS_HTTP")" \
            --argjson kvRead "$(ok200 "$KV_HTTP")" \
            --argjson targetExists "$(ok200 "$TARGET_HTTP")" \
            --argjson workersErrors "$(errors /tmp/workers.json)" \
            --argjson kvErrors "$(errors /tmp/kv.json)" \
            --argjson targetErrors "$(errors /tmp/target.json)" \
            '{status:"success",checkedAt:$checkedAt,permissions:{workersRead:$workersRead,kvRead:$kvRead},targetWorkerExists:$targetExists,http:{workers:$workersHttp,kv:$kvHttp,targetWorker:$targetHttp},errors:{workers:$workersErrors,kv:$kvErrors,targetWorker:$targetErrors},cloudflareStateChanged:false}' \
            > /tmp/concursos-credential-probe-result.json

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/concursos-credential-probe-result.json ] || printf '%s\n' '{"status":"failed","error":"workflow_failed_before_result","cloudflareStateChanged":false}' > /tmp/concursos-credential-probe-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/concursos-credential-probe-result.json requests/concursos-credential-probe-result.json
          git add requests/concursos-credential-probe-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record Concursos Cloudflare capability probe"
          git push
