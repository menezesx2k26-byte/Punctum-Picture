name: Onboard punctumpicture.com into owner Cloudflare account

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/cloudflare-zone-onboard.json"

permissions:
  contents: write

concurrency:
  group: punctum-zone-onboard
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Create or inspect zone
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          ZHTTP="$(curl -sS -G -o /tmp/zones.json -w '%{http_code}' "${AUTH[@]}" \
            --data-urlencode 'name=punctumpicture.com' \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            "$API/zones" || true)"
          if [ "$ZHTTP" != "200" ] || ! jq -e '.success == true' /tmp/zones.json >/dev/null 2>&1; then
            jq -n --arg h "$ZHTTP" '{status:"failed",error:"zone_read_failed",http:$h,domainTouched:false}' > /tmp/zone-onboard-result.json
            exit 21
          fi

          ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/zones.json)"
          CREATED=false
          if [ -z "$ZONE_ID" ]; then
            BODY="$(jq -nc --arg account "$CLOUDFLARE_ACCOUNT_ID" '{name:"punctumpicture.com",account:{id:$account},type:"full",jump_start:true}')"
            CHTTP="$(curl -sS -o /tmp/create-zone.json -w '%{http_code}' -X POST "${AUTH[@]}" --data "$BODY" "$API/zones" || true)"
            if [ "$CHTTP" != "200" ] && [ "$CHTTP" != "201" ]; then
              jq -n --arg h "$CHTTP" --argjson errors "$(jq -c '.errors // []' /tmp/create-zone.json 2>/dev/null || echo '[]')" '{status:"failed",error:"zone_create_failed",http:$h,cloudflareErrors:$errors,domainTouched:false}' > /tmp/zone-onboard-result.json
              exit 22
            fi
            if ! jq -e '.success == true' /tmp/create-zone.json >/dev/null 2>&1; then
              jq -n --arg h "$CHTTP" --argjson errors "$(jq -c '.errors // []' /tmp/create-zone.json 2>/dev/null || echo '[]')" '{status:"failed",error:"zone_create_rejected",http:$h,cloudflareErrors:$errors,domainTouched:false}' > /tmp/zone-onboard-result.json
              exit 23
            fi
            ZONE_ID="$(jq -r '.result.id // empty' /tmp/create-zone.json)"
            CREATED=true
          fi

          curl -fsS "${AUTH[@]}" "$API/zones/$ZONE_ID" > /tmp/zone.json
          curl -fsS "${AUTH[@]}" "$API/zones/$ZONE_ID/dns_records?per_page=100" > /tmp/records.json

          STATUS="$(jq -r '.result.status // empty' /tmp/zone.json)"
          NS_JSON="$(jq -c '.result.name_servers // []' /tmp/zone.json)"
          ORIG_NS_JSON="$(jq -c '.result.original_name_servers // []' /tmp/zone.json)"
          RECORD_COUNT="$(jq '.result | length' /tmp/records.json)"
          HAS_ROOT="$(jq '[.result[] | select(.name == "punctumpicture.com")] | length > 0' /tmp/records.json)"
          HAS_WWW="$(jq '[.result[] | select(.name == "www.punctumpicture.com")] | length > 0' /tmp/records.json)"
          TYPES_JSON="$(jq -c '[.result[].type] | group_by(.) | map({type:.[0],count:length})' /tmp/records.json)"

          jq -n \
            --arg status "$STATUS" \
            --argjson created "$CREATED" \
            --argjson nameservers "$NS_JSON" \
            --argjson originalNameservers "$ORIG_NS_JSON" \
            --argjson recordCount "$RECORD_COUNT" \
            --argjson hasRoot "$HAS_ROOT" \
            --argjson hasWww "$HAS_WWW" \
            --argjson recordTypes "$TYPES_JSON" \
            '{status:"success",zoneCreated:$created,zoneStatus:$status,assignedNameServers:$nameservers,originalNameServers:$originalNameservers,scannedDnsRecordCount:$recordCount,scannedHasRoot:$hasRoot,scannedHasWww:$hasWww,recordTypes:$recordTypes,domainTouched:false,nameserverDelegationChanged:false}' \
            > /tmp/zone-onboard-result.json

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/zone-onboard-result.json ] || printf '%s\n' '{"status":"failed","error":"workflow_failed_before_result","domainTouched":false}' > /tmp/zone-onboard-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/zone-onboard-result.json requests/cloudflare-zone-onboard-result.json
          git add requests/cloudflare-zone-onboard-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record Punctum Cloudflare zone onboarding result"
          git push
