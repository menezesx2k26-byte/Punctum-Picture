name: Repair hero binary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-hero-binary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Decode text-encoded hero into real WebP bytes
        shell: bash
        run: |
          set -euo pipefail
          src='public/images/hero-maria.webp'
          tmp="$(mktemp)"

          base64 --decode "$src" > "$tmp"

          [ "$(head -c 4 "$tmp")" = 'RIFF' ]
          [ "$(dd if="$tmp" bs=1 skip=8 count=4 status=none)" = 'WEBP' ]

          mv "$tmp" "$src"

          echo '=== repaired asset ==='
          file "$src"
          xxd -l 16 "$src"
          sha256sum "$src"

      - name: Commit repaired binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero-maria.webp
          git commit -m "fix: store hero as real WebP binary"
          git push
