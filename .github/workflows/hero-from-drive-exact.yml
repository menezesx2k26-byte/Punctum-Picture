name: Replace hero from exact Drive source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hero-from-drive-exact.yml"

permissions:
  contents: write

concurrency:
  group: punctum-hero-from-drive-exact
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download exact 4K hero from Drive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1E3ETCZPEwUMYmpUW7tT7KycMhEUCOqFk&export=download&confirm=t'
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 "$URL" -o /tmp/hero-maria-q90.webp
          file /tmp/hero-maria-q90.webp
          wc -c /tmp/hero-maria-q90.webp
          sha256sum /tmp/hero-maria-q90.webp
          [ "$(wc -c < /tmp/hero-maria-q90.webp)" = '371054' ]
          echo '448b8888b073e0690093097d0feda82b5424ff1c72dd1238c1e8f0b8d28026e0  /tmp/hero-maria-q90.webp' | sha256sum -c -
          [ "$(head -c 4 /tmp/hero-maria-q90.webp)" = 'RIFF' ]
          [ "$(dd if=/tmp/hero-maria-q90.webp bs=1 skip=8 count=4 status=none)" = 'WEBP' ]

      - name: Install ImageMagick and verify decode
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          identify /tmp/hero-maria-q90.webp
          [ "$(identify -format '%wx%h' /tmp/hero-maria-q90.webp)" = '3840x2160' ]

      - name: Replace production hero
        run: cp /tmp/hero-maria-q90.webp public/images/hero-maria.webp

      - name: Install dependencies
        run: npm ci

      - name: Focused hero regression
        run: npm test -- tests/unit/public-visuals.spec.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Full tests
        run: npm test

      - name: Commit exact verified hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/hero-maria.webp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Exact hero already present.'
            exit 0
          fi
          git commit -m 'fix: publish exact verified 4k hero'
          git push origin HEAD:main
