name: Audit hero candidates

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hero-from-drive-exact.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Audit every branch hero
        shell: bash
        run: |
          set -u
          git fetch --all --prune
          echo '=== HERO CANDIDATES ==='
          while read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            if git cat-file -e "$ref:public/images/hero-maria.webp" 2>/dev/null; then
              out="/tmp/hero-${branch//\//_}.webp"
              git show "$ref:public/images/hero-maria.webp" > "$out"
              bytes=$(wc -c < "$out")
              sha=$(sha256sum "$out" | awk '{print $1}')
              if dims=$(identify -format '%wx%h' "$out" 2>/dev/null); then
                echo "VALID branch=$branch bytes=$bytes dims=$dims sha256=$sha"
              else
                echo "INVALID branch=$branch bytes=$bytes sha256=$sha"
              fi
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
