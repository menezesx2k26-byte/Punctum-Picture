name: Final release Miranda subdomain

on:
  push:
    branches: ["miranda-editorial"]
    paths:
      - "ops/miranda-final-trigger"
      - ".github/workflows/miranda-release-final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: punctum-miranda-final-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      MIRANDA_DB: punctum-picture-miranda
      MIRANDA_ORIGINALS: punctum-picture-miranda-originals
      MIRANDA_BACKUPS: punctum-picture-miranda-backups
      MIRANDA_WORKER: punctum-picture-miranda
      MIRANDA_ORIGIN: https://miranda.punctumpicture.com

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: |
          set -euo pipefail
          echo install >/tmp/miranda-final-stage
          npm ci
          npm install --global --no-audit --no-fund wrangler@4.125.0
          mkdir -p .miranda requests

      - name: Resolve isolated D1
        shell: bash
        run: |
          set -euo pipefail
          echo resolve-d1 >/tmp/miranda-final-stage
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_D1_API_TOKEN:?missing CLOUDFLARE_D1_API_TOKEN}"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -o /tmp/miranda-d1-list.json
          DB_ID="$(jq -r --arg name "$MIRANDA_DB" '.result[]? | select(.name == $name) | (.uuid // .id // empty)' /tmp/miranda-d1-list.json | head -n1)"
          test -n "$DB_ID"
          echo "MIRANDA_DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Verify isolated public snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo verify-d1 >/tmp/miranda-final-stage
          node <<'NODE'
          import fs from 'node:fs';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_D1_API_TOKEN;
          const dbId = process.env.MIRANDA_DB_ID;
          if (!dbId) throw new Error('miranda_db_id_missing');
          const sql = `SELECT
            (SELECT COUNT(*) FROM albums WHERE status='published' AND deleted_at IS NULL) AS publishedAlbums,
            (SELECT COUNT(*) FROM images i INNER JOIN albums a ON a.id=i.album_id
              WHERE i.status='ready' AND i.deleted_at IS NULL
                AND a.status='published' AND a.deleted_at IS NULL) AS publicImages,
            (SELECT COUNT(*) FROM images WHERE id NOT LIKE 'static-%' AND status='ready' AND deleted_at IS NULL) AS dynamicReady,
            (SELECT COUNT(*) FROM site_config_pointers WHERE id=1) AS pointers,
            (SELECT schema_version FROM site_config WHERE id=1) AS schemaVersion`;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbId}/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql }),
          });
          const payload = await response.json();
          const row = payload?.result?.[0]?.results?.[0];
          const validation = {
            httpStatus: response.status,
            success: payload?.success !== false,
            row: row ?? null,
            errors: payload?.errors ?? [],
          };
          fs.writeFileSync('/tmp/miranda-d1-validation.json', JSON.stringify(validation, null, 2) + '\n');
          if (!response.ok || payload.success === false || !row) {
            throw new Error(`miranda_d1_verify_failed:${JSON.stringify(validation).slice(0,1000)}`);
          }
          if (
            Number(row.publishedAlbums) !== 16 ||
            Number(row.publicImages) !== 192 ||
            Number(row.dynamicReady) !== 80 ||
            Number(row.pointers) !== 1 ||
            Number(row.schemaVersion) !== 4
          ) {
            throw new Error(`miranda_public_snapshot_invalid:${JSON.stringify(row)}`);
          }
          console.log(`Miranda public snapshot OK: ${JSON.stringify(row)}`);
          NODE

      - name: Verify frontend
        env:
          PUBLIC_SITE_URL: https://miranda.punctumpicture.com
          SITE_ORIGIN: https://miranda.punctumpicture.com
        run: |
          set -euo pipefail
          echo frontend >/tmp/miranda-final-stage
          npm run typecheck
          npm run lint
          npx vitest run tests/unit
          npm run build

      - name: Deploy only Miranda Worker and custom domain
        shell: bash
        run: |
          set -euo pipefail
          echo deploy >/tmp/miranda-final-stage
          node <<'NODE'
          import fs from 'node:fs';
          const config = {
            "$schema": "../node_modules/wrangler/config-schema.json",
            name: "punctum-picture-miranda",
            main: "../worker/index.ts",
            compatibility_date: "2026-05-22",
            compatibility_flags: ["nodejs_compat"],
            workers_dev: true,
            assets: {
              directory: "../dist/client",
              binding: "ASSETS",
              not_found_handling: "single-page-application",
              run_worker_first: ["/api/*", "/admin/*", "/media/*", "/sitemap.xml", "/robots.txt"]
            },
            routes: [{ pattern: "miranda.punctumpicture.com", custom_domain: true }],
            d1_databases: [{
              binding: "DB",
              database_name: "punctum-picture-miranda",
              database_id: process.env.MIRANDA_DB_ID,
              migrations_dir: "../migrations"
            }],
            r2_buckets: [
              { binding: "ORIGINALS", bucket_name: "punctum-picture-miranda-originals" },
              { binding: "BACKUPS", bucket_name: "punctum-picture-miranda-backups" }
            ],
            images: { binding: "IMAGES" },
            observability: { enabled: true },
            vars: {
              ENVIRONMENT: "miranda",
              SITE_ORIGIN: "https://miranda.punctumpicture.com",
              PUBLIC_SITE_URL: "https://miranda.punctumpicture.com",
              PUBLIC_WHATSAPP_E164: "UNSPECIFIED",
              PUBLIC_INSTAGRAM_URL: "UNSPECIFIED",
              MAX_UPLOAD_BYTES: "26214400",
              ALLOWED_MIME_TYPES: "image/jpeg,image/png,image/webp",
              PRESIGNED_URL_TTL_SECONDS: "900",
              CONTACT_RATE_LIMIT_WINDOW_SECONDS: "3600",
              CONTACT_RATE_LIMIT_MAX: "5",
              ADMIN_RATE_LIMIT_WINDOW_SECONDS: "60",
              ADMIN_RATE_LIMIT_MAX: "60",
              BACKUP_PREFIX: "backups/d1",
              BACKUP_RETENTION_DAYS: "180",
              CLEANUP_ORPHAN_UPLOAD_AGE_HOURS: "24"
            }
          };
          fs.writeFileSync('.miranda/wrangler-final.jsonc', JSON.stringify(config, null, 2) + '\n');
          NODE
          wrangler deploy --config .miranda/wrangler-final.jsonc 2>&1 | tee /tmp/miranda-final-deploy.log

      - name: Smoke test custom domain
        shell: bash
        run: |
          set -euo pipefail
          echo smoke >/tmp/miranda-final-stage
          curl -fsS --retry 20 --retry-all-errors --retry-delay 4 "$MIRANDA_ORIGIN/" -o /tmp/miranda-home.html
          grep -qi 'punctum' /tmp/miranda-home.html
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$MIRANDA_ORIGIN/api/public/stats" -o /tmp/miranda-stats.json
          jq -n \
            --arg status success \
            --arg branch miranda-editorial \
            --arg domain "$MIRANDA_ORIGIN" \
            --arg worker "$MIRANDA_WORKER" \
            --arg db "$MIRANDA_DB" \
            --arg dbId "$MIRANDA_DB_ID" \
            --arg originals "$MIRANDA_ORIGINALS" \
            --arg backups "$MIRANDA_BACKUPS" \
            --slurpfile validation /tmp/miranda-d1-validation.json \
            '{status:$status,branch:$branch,domain:$domain,worker:$worker,d1:{name:$db,id:$dbId,validation:$validation[0]},r2:{originals:$originals,backups:$backups},source:"requests/source-public-state-result.json",productionDomainTouched:false}' \
            >/tmp/miranda-final-result.json

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/miranda-final-result.json ]; then
            STAGE="$(cat /tmp/miranda-final-stage 2>/dev/null || echo unknown)"
            if [ -f /tmp/miranda-d1-validation.json ]; then
              jq -n --arg stage "$STAGE" --slurpfile validation /tmp/miranda-d1-validation.json \
                '{status:"failed",branch:"miranda-editorial",stage:$stage,d1Validation:$validation[0],productionDomainTouched:false}' \
                >/tmp/miranda-final-result.json
            else
              jq -n --arg stage "$STAGE" '{status:"failed",branch:"miranda-editorial",stage:$stage,productionDomainTouched:false}' >/tmp/miranda-final-result.json
            fi
          fi
          cp /tmp/miranda-final-result.json requests/miranda-final-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/miranda-final-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record final Miranda release"
          git push origin HEAD:miranda-editorial
