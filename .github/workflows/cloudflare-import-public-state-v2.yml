name: Import Punctum public state v2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "requests/cloudflare-import-public-state-v2.json"

permissions:
  contents: write

concurrency:
  group: punctum-cloudflare-import-public-state-v2
  cancel-in-progress: false

jobs:
  run-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install trusted Wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.125.0

      - name: Run validated importer
        run: node scripts/import-public-state.mjs

      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/cloudflare-import-public-state-v2-result.json ]; then
            printf '%s\n' '{"status":"failed","error":"workflow_failed_before_script_result","domainTouched":false,"siteConfigActivated":false}' > /tmp/cloudflare-import-public-state-v2-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/cloudflare-import-public-state-v2-result.json requests/cloudflare-import-public-state-v2-result.json
          git add requests/cloudflare-import-public-state-v2-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record isolated public-state import v2"
          git push
